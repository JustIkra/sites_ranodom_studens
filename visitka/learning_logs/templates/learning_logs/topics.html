{% extends "learning_logs/base.html" %}

{% block content %}
<h2>Ваши темы</h2>
<ul>
  {% for topic in topics %}
  <li>{{ topic.text }}</li>
  {% empty %}
  <li>Темы пока отсутствуют.</li>
  {% endfor %}
</ul>
<p><a href="{% url 'learning_logs:new_topic' %}">Добавить новую тему</a></p>
{% endblock %}
