services:

  visitka:
    build:
      context: ./visitka
      dockerfile: Dockerfile
    container_name: visitka
    environment:
      - DJANGO_DEBUG=1
      - DJANGO_ALLOWED_HOSTS=172.30.4.14
      - DJANGO_SECRET_KEY=${VISITKA_SECRET_KEY:-change-me}
    ports:
      - "8000:8000"
    volumes:
      - visitka_static:/app/staticfiles
    restart: unless-stopped

  sitefinal:
    build:
      context: ./sitefinal
      dockerfile: Dockerfile
    container_name: sitefinal
    environment:
      - DJANGO_ENV=local
      - DJANGO_DEBUG=1
      - SECRET_KEY=${FINAL_SECRET_KEY:-change-me}
      - DJANGO_ALLOWED_HOSTS=172.30.4.14
    ports:
      - "8001:8001"
    volumes:
      - sitefinal_static:/app/staticfiles
      - sitefinal_media:/app/media
    restart: unless-stopped

volumes:
  visitka_static:
  sitefinal_static:
  sitefinal_media:


