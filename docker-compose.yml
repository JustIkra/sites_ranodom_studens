services:

  visitka:
    build:
      context: ./visitka
      dockerfile: Dockerfile
    container_name: visitka
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-0}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,172.30.4.14,alexpochikaev.ru,www.alexpochikaev.ru
      - DJANGO_SECRET_KEY=${VISITKA_SECRET_KEY:-change-me}
      - CSRF_TRUSTED_ORIGINS=https://alexpochikaev.ru,https://www.alexpochikaev.ru,http://172.30.4.14
    ports:
      - "8000:8000"
    volumes:
      - visitka_static:/app/staticfiles
      - visitka_db:/app
      - visitka_logs:/app/logs  # Use named volume for logs
    restart: unless-stopped
    networks:
      - app_network

  sitefinal:
    build:
      context: ./sitefinal
      dockerfile: Dockerfile
    container_name: sitefinal
    environment:
      - DJANGO_ENV=${DJANGO_ENV:-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-0}
      - SECRET_KEY=${FINAL_SECRET_KEY:-change-me}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,172.30.4.14,my-russian-potencial.ru,www.my-russian-potencial.ru
      - DJANGO_CORS_ORIGINS=https://my-russian-potencial.ru,https://www.my-russian-potencial.ru,http://172.30.4.14
      - DJANGO_CSRF_TRUSTED_ORIGINS=https://my-russian-potencial.ru,https://www.my-russian-potencial.ru,http://172.30.4.14
      # MySQL configuration (uncomment when using MySQL)
      # - MYSQL_DATABASE=${MYSQL_DATABASE}
      # - MYSQL_USER=${MYSQL_USER}
      # - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      # - MYSQL_HOST=${MYSQL_HOST:-localhost}
      # - MYSQL_PORT=${MYSQL_PORT:-3306}
    ports:
      - "8001:8001"
    volumes:
      - sitefinal_static:/app/staticfiles
      - sitefinal_media:/app/media
      - sitefinal_db:/app
      - sitefinal_logs:/app/logs  # Use named volume for logs
    restart: unless-stopped
    networks:
      - app_network

volumes:
  visitka_static:
  visitka_db:
  visitka_logs:
  sitefinal_static:
  sitefinal_media:
  sitefinal_db:
  sitefinal_logs:

networks:
  app_network:
    driver: bridge
